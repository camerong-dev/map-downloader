name: Linux runtime and GUI checks
on: [push, pull_request, workflow_dispatch]
jobs:
  ubuntu:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install native QGIS and Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qgis python3-qgis python3-gdal python3-numpy python3-tk python3-venv xvfb
      - name: Test download and launcher code
        run: /usr/bin/python3 -m unittest discover -s tests -v
      - name: Test QGIS raster workers
        env:
          QGIS_PREFIX_PATH: /usr
          QT_QPA_PLATFORM: offscreen
        run: |
          /usr/bin/python3 tests/mosaic_integration.py
          /usr/bin/python3 tests/split_integration.py
          /usr/bin/python3 tests/compression_integration.py
      - name: Smoke-test desktop tabs
        run: |
          xvfb-run -a /usr/bin/python3 -c "from app import App; app=App(); app.withdraw(); app.update_idletasks(); assert app.splitter.create_overview.get(); assert app.splitter.overview_resolution.get() == '100'; assert app.mosaic.maximum.get() == '0.40'; app.destroy()"
