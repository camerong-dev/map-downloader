name: Linux runtime and GUI checks
on: [push, pull_request, workflow_dispatch]
jobs:
  ubuntu:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install native QGIS and Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qgis python3-qgis python3-gdal python3-numpy python3-tk python3-venv xvfb
      - name: Report installed GIS versions
        run: |
          /usr/bin/python3 -c "from osgeo import gdal; from qgis.core import Qgis; print(gdal.VersionInfo('--version')); print('QGIS', Qgis.QGIS_VERSION)"
      - name: Test unit code and all QGIS workers
        env:
          QGIS_PREFIX_PATH: /usr
          QT_QPA_PLATFORM: offscreen
        run: /usr/bin/python3 check.py --qgis /usr
      - name: Smoke-test desktop tabs
        run: |
          xvfb-run -a /usr/bin/python3 tests/gui_smoke.py
